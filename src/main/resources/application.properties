# ── Carga opcional de configuracion local (no versionada en Git) ──
spring.config.import=optional:file:.env[.properties],optional:file:./application-local.properties,optional:classpath:application-local.properties

# ── Servidor ──
server.port=${PORT:8081}

# ── PostgreSQL ──
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5436/prueba1}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ──
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# ── Flyway (gestionado manualmente en FlywayConfig.java) ──
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.table=flyway_schema_history

# ── Deshabilitar Config Server ──
spring.cloud.config.enabled=false

# ── GestoPago / PuntoRed Mexico Auth & Transacciones (Feign) ──
gestopago.auth.url=${GESTOPAGO_URL:https://gestopago.portalventas.net}
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:}
gestopago.auth.password=${GESTOPAGO_PASSWORD:}
gestopago.auth.api-key=${GESTOPAGO_API_KEY:}
gestopago.auth.refresh-rate-ms=${GESTOPAGO_REFRESH_MS:3600000}
gestopago.tx.aes-key=${GESTOPAGO_TX_AES_KEY:}
gestopago.tx.aes-iv=${GESTOPAGO_TX_AES_IV:}
gestopago.tx.upc-default=${GESTOPAGO_TX_UPC:0}
gestopago.productos.sync-on-startup=${GESTOPAGO_SYNC_ON_STARTUP:false}
gestopago.simulacion.respaldo-automatico=${GESTOPAGO_RESPALDO_SIMULADO:true}

# ── Proveedor activo del catalogo/pagos: GESTOPAGO_MX (Mexico oficial + respaldo simulado) o PUNTORED_CO ──
app.proveedor.modo=${APP_PROVEEDOR_MODO:GESTOPAGO_MX}

# ── SSL / TrustStore / TLS explicito para cliente GestoPago ──
gestopago.ssl.enabled=${GESTOPAGO_SSL_ENABLED:true}
gestopago.ssl.trust-store=${GESTOPAGO_SSL_TRUSTSTORE:classpath:certs/gestopago-truststore.p12}
gestopago.ssl.trust-store-password=${GESTOPAGO_SSL_TRUSTSTORE_PASSWORD:changeit}
gestopago.ssl.trust-store-type=${GESTOPAGO_SSL_TRUSTSTORE_TYPE:PKCS12}
gestopago.ssl.protocols=${GESTOPAGO_SSL_PROTOCOLS:TLSv1.3,TLSv1.2}

# ── Puntored / GestoPago Servicios H2H - V2 ──
puntored.api.url=${PUNTORED_API_URL:https://services.preprodcxr.co/puntored/api/v1}
puntored.api.commerce=${PUNTORED_COMMERCE:}
puntored.api.point-of-sale=${PUNTORED_POS:}
puntored.api.terminal=${PUNTORED_TERMINAL:}
puntored.api.username=${PUNTORED_USERNAME:}
puntored.api.password=${PUNTORED_PASSWORD:}
puntored.api.transactional-password=${PUNTORED_TX_PASSWORD:}
puntored.api.token-refresh-ms=${PUNTORED_REFRESH_MS:3600000}
puntored.api.connect-timeout-ms=${PUNTORED_CONNECT_TIMEOUT_MS:10000}
puntored.api.read-timeout-ms=${PUNTORED_READ_TIMEOUT_MS:25000}
puntored.api.permitir-simulacion=${PUNTORED_PERMITIR_SIMULACION:true}

# ── Correo 2FA (SMTP y APIs HTTP compatibles con Render Free) ──
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
seguridad.2fa.correo.brevo-api-key=${BREVO_API_KEY:}
seguridad.2fa.correo.resend-api-key=${RESEND_API_KEY:}
seguridad.2fa.correo.remitente=${MAIL_FROM:${MAIL_USERNAME:}}
seguridad.2fa.expiracion-minutos=${PIN_2FA_EXPIRACION_MINUTOS:5}
seguridad.2fa.mostrar-pin-respuesta=${PIN_2FA_MOSTRAR_RESPUESTA:true}

# ── Redis ──
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:1500ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:1500ms}

# TTL del cache de productos y catalogo (en segundos)
app.cache.productos.ttl-seconds=${CACHE_PRODUCTOS_TTL:3600}
app.cache.productos.db-ttl-seconds=${CACHE_PRODUCTOS_DB_TTL:86400}
app.cache.puntored.ttl-seconds=${CACHE_PUNTORED_TTL:3600}
app.cache.puntored.db-ttl-seconds=${CACHE_PUNTORED_DB_TTL:86400}

# ── Seguridad ──
seguridad.aes.llave=${AES_LLAVE:}
seguridad.jwt.llave=${JWT_LLAVE:}
seguridad.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:15}
seguridad.sesion.inactividad-minutos=${SESION_INACTIVIDAD_MINUTOS:3}
seguridad.sesion.revision-ms=${SESION_REVISION_MS:30000}
cuenta.saldo-inicial=${CUENTA_SALDO_INICIAL:0.00}
spring.jackson.mapper.allow-coercion-of-scalars=false

# ── CORS ──
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
