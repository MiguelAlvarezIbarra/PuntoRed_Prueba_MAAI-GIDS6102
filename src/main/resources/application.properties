# ── Servidor ──
server.port=${PORT:8081}

# ── PostgreSQL ──
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5436/prueba1}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Popeye08}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ──
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# ── Flyway (gestionado manualmente en FlywayConfig.java) ──
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.table=flyway_schema_history

# ── Deshabilitar Config Server ──
spring.cloud.config.enabled=false

# ── GestoPago Auth (Feign) ──
gestopago.auth.url=${GESTOPAGO_URL:https://gestopago.portalventas.net}
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:83}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:GPS83-TPV-17}
gestopago.auth.password=${GESTOPAGO_PASSWORD:12345678}
gestopago.auth.refresh-rate-ms=${GESTOPAGO_REFRESH_MS:3600000}

# ── Redis ──
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:1500ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:1500ms}

# TTL del cache de productos en segundos (1 hora)
app.cache.productos.ttl-seconds=${CACHE_PRODUCTOS_TTL:3600}

# ── Seguridad ──
seguridad.aes.llave=${AES_LLAVE:u/EC0kzidACsyNCTbbea/7Wj1t86k5i3Qrhu5HYxCMM=}
seguridad.jwt.llave=${JWT_LLAVE:O6FkpHfy9Q4H6mJUgcQQE6oQ6NNv9ryNxiiaH1v1NdA=}
seguridad.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:15}
seguridad.sesion.inactividad-minutos=${SESION_INACTIVIDAD_MINUTOS:3}
seguridad.sesion.revision-ms=${SESION_REVISION_MS:30000}
cuenta.saldo-inicial=${CUENTA_SALDO_INICIAL:0.00}
spring.jackson.mapper.allow-coercion-of-scalars=false

# ── CORS ──
# Para Render: agrega la variable CORS_ALLOWED_ORIGINS con la URL de tu frontend
# Ejemplo: https://mi-frontend.vercel.app
# Dejar en * solo para pruebas con Swagger/Postman
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

